site_name: DocScript Document
site_description: A lightweight, code-like standard for writing documentation.
site_url: https://keyhan-tiny112.github.io/DocScript/
repo_url: https://github.com/keyhan-tiny112/DocScript
repo_name: DocScript Github Page

docs_dir: ./Docs

theme:
  name: material
  language: en
  direction: rtl
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight

# extra_css:
#   - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Spec: SPEC.md
  - Examples:
      - Auth API: Examples/auth-api.md

copyright: MIT License
